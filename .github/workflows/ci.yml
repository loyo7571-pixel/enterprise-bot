name: AI app CI/CD pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Run Pytest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TESTING: "True"
        run: |
          pytest tests/test_rag.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/enterprise-bot:${{ github.sha }}

  deploy:
    needs: build-and-test
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Deployment Image
        run: |
          # Replace the image tag with the new SHA
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/enterprise-bot:${{ github.sha }}|g" k8s/fastapi-deployment.yaml

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/fastapi-deployment.yaml
          kubectl rollout status deployment/fastapi