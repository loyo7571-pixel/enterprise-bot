version: '3.8'

services:
  # 1. The PostgreSQL Database
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: aiapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d aiapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The FastAPI Application
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Use 'db' as the hostname because Docker Compose creates a network
      DATABASE_URL: postgresql://admin:secretpassword@db:5432/aiapp
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      # Mount the chroma_dev folder to persist vector data
      - ./dev:/app/dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: